[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-group-audit"
version = "0.1.0"
description = "Local friend coverage, overlap, and change reports for WeChat groups"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{name = "gc240295436-sudo"}]
dependencies = []

[project.optional-dependencies]
live = ["pycryptodome==3.23.0"]

[project.scripts]
wga = "wechat_group_audit.cli:main"

[project.urls]
Repository = "https://github.com/gc240295436-sudo/wechat-group-audit"
Issues = "https://github.com/gc240295436-sudo/wechat-group-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]
